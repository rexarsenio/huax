name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Detect secrets
        run: |
          detect-secrets scan --all-files --force-use-all-plugins > scan.json
          python - <<'PY'
import json, sys
with open("scan.json", "r", encoding="utf-8") as handle:
    data = json.load(handle)
if data.get("results"):
    print("Potential secrets detected:")
    for path, findings in data["results"].items():
        print(f" - {path}: {len(findings)} findings")
    sys.exit(1)
PY
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Pytest (unit)
        run: pytest -m "not integration"

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable corepack
        run: corepack enable
      - name: Use PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: dashboard
        run: pnpm lint
      - name: Unit tests
        working-directory: dashboard
        run: pnpm test -- --run
      - name: Build
        working-directory: dashboard
        run: pnpm build
