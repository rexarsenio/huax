[project]
name = "spvx-lite"
version = "0.1.0"
description = "SPVX-Lite pipeline for chokepoint-driven energy signals."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Huax Energy Intelligence" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "duckdb>=1.0",
  "pyarrow>=16",
  "requests>=2.32",
  "pydantic-settings>=2.3",
  "typer[all]>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "joblib>=1.4",
  "pandera>=0.18",
  "jsonschema>=4.21",
  "prometheus-client>=0.20",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "pyyaml>=6.0",
  "xarray>=2024.3",
  "netCDF4>=1.7",
  "pydap>=3.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4.0",
  "black>=24.0",
  "isort>=5.13",
  "mypy>=1.10",
  "bandit>=1.7",
  "safety>=3.0",
  "detect-secrets>=1.5"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A"]
ignore = ["E501"]  # Line too long (handled by black)
per-file-ignores = {"tests/*" = ["F401", "F811"]}  # Allow unused imports in tests

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --tb=short --strict-markers --cov=src --cov-report=term-missing --cov-report=xml"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
