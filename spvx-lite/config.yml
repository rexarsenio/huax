ingest:
  lookback_days: 400
  mpa:
    base_url: "https://api.mpa.gov.sg/vessels"  # placeholder
  rotterdam:
    base_url: "https://api.portofrotterdam.com/calls"  # placeholder
  straits:
    base_url: "https://opendata.turkeyvts.com/notices"  # placeholder
sea_state:
  provider: "cmems"
  waves_dataset_id: "cmems_mod_glo_wav_anfc_0.083deg_PT3H-i"
  currents_dataset_id: "cmems_mod_glo_phy-cur_anfc_0.083deg_PT6H-i"  # CORRECT: Physics currents (uo, vo)
  lookback_days: 2
  out_dir: "data/sea_state"
  buffer_km: 50
  features:
    - id: "hs"
      dataset: "waves"
      type: "scalar"
      variables: ["VHM0", "hs", "swh", "significant_wave_height"]
      stats: ["mean", "p95"]
    - id: "sst_anom"
      dataset: "waves"
      type: "scalar"
      variables: ["sst_anom", "thetao_anomaly"]
      stats: ["mean", "p90"]
    - id: "current_speed"
      dataset: "currents"
      type: "vector_magnitude"
      variables: ["uo", "vo"]
      stats: ["p90"]
    - id: "opp_current"
      dataset: "currents"
      type: "opposing"
      variables: ["uo", "vo"]
      stats: ["mean"]
open_sea:
  enabled: true
  downsample_secs: 60            # max 1 fix / 60s / MMSI for geofence tests
  hysteresis_hits: 2             # consecutive hits required for enter/exit
  ttl_min:
    moving: 30                   # TTL when vessel is moving
    anchorage: 90                # TTL in anchorages (longer radio silence)
  sog_thresholds:
    dwell_max_kn: 1.0            # SOG threshold for dwell accumulation
  gates:
    width_nm_default: 0.8        # default crossing band width
  cmems:
    enabled: true
    features: [hs, uo, vo, sst_anom]  # hs=waves, uo/vo=currents (no wind yet)
  sis:
    weights: { wave: 0.33, head_current: 0.33, head_wind: 0.33 }
    high_impact_p: 0.70
  flux:
    count_modes: ["gate_hits", "paired_transits"]
    tanker_only: true
    sog_min_kn: 2.0
    rehit_hours: 6
    rehit_hours_by_group:
      GATE_SUEZ_N: 3
      GATE_SUEZ_S: 3
      GATE_BOSPORUS_N: 2
      GATE_BOSPORUS_S: 2
  geo:
    polygons_path: data/geo/polygons.geojson
    gates_path: data/geo/gates.geojson
  polygons:
    terminals: data/geo/oil_terminals.geojson
    sts_zones: data/geo/sts_zones.geojson
    hysteresis_nm: 0.5
    ttl_out_min: 15
    min_dwell:
      terminal_min: 120
      sts_min: 360
